[project]
name = "marktmuster-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "apscheduler>=3.10,<4",
  "pydantic-settings>=2.4",
  "email-validator>=2.1",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "UP"]
"alembic/env.py" = ["I001"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
