# Start: cp .env.example .env  (Werte eintragen)  ->  docker compose up --build
services:
  api:
    restart: unless-stopped
    build: ./backend
    command: ["./entrypoint.sh", "api"]
    env_file: .env
    volumes: [db:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    restart: unless-stopped
    build: ./backend
    command: ["./entrypoint.sh", "worker"]
    env_file: .env
    volumes: [db:/data]
    depends_on:
      api: { condition: service_healthy }
  web:
    restart: unless-stopped
    build: ./frontend
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
volumes:
  db:
